<script>
document.addEventListener("DOMContentLoaded", () => {
const shell = document.getElementById("shell");

  const syncAccent = () => {
    const page = shell?.dataset.context || "kick";
    const css = getComputedStyle(document.documentElement);
    const accent = page === "snare"
      ? css.getPropertyValue("--snare").trim()
      : page === "hat"
        ? css.getPropertyValue("--hat").trim()
        : css.getPropertyValue("--kick").trim();
    shell?.style.setProperty("--shell-accent", accent);
  };
syncAccent();
  const observer = new MutationObserver(syncAccent);
  if (shell) observer.observe(shell, { attributes: true, attributeFilter: ["data-context"] });
});
</script>
