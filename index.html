<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0f" />
    <title>interPhace - interPhace</title>
    <link rel="stylesheet" href="style.css?v=506" />
    <link rel="stylesheet" href="shared/shell.css?v=508" />
    <script src="app.js?v=509" defer></script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="favicon.ico" type="image/x-icon">
</head>
  <body id="app1">
    <main id="shell" class="shell-app">
      <header id="shellTop" class="shell-top" aria-label="interPhace top bar"></header>

      <section id="shellMiddle" class="shell-middle">
        <section id="app1_startup" class="app1-page app1-startup-page" aria-label="interPhace startup">
          <div class="app1-startup-mark">interPhace</div>
        </section>

        <section id="app1_b1_p1" class="app1-page" aria-label="Project">
          <div class="app1-panel">
            <div id="app1_b1_p1_title" class="app1-title">project</div>
            <div class="app1-controls">
              <label class="macroControl">
                <span class="macroLabel">Root Note</span>
                <input id="app1_b1_p1_rootNote" class="macroSlider" type="range" min="21" max="108" step="1" value="60" />
                <span id="app1_b1_p1_rootNote_value" class="macroValue">C</span>
              </label>
              <label class="macroControl">
                <span class="macroLabel">Scale</span>
                <input id="app1_b1_p1_scale" class="macroSlider" type="range" min="0" max="5" step="1" value="0" />
                <span id="app1_b1_p1_scale_value" class="macroValue">Major</span>
              </label>
              <label class="macroControl">
                <span class="macroLabel">Tempo</span>
                <input id="app1_b1_p1_tempo" class="macroSlider" type="range" min="40" max="200" step="1" value="75" />
                <span id="app1_b1_p1_tempo_value" class="macroValue">75 BPM</span>
              </label>
              <label class="macroControl">
                <span class="macroLabel">Length</span>
                <input id="app1_b1_p1_length" class="macroSlider" type="range" min="4" max="64" step="4" value="4" />
                <span id="app1_b1_p1_length_value" class="macroValue">4 bars (0:13)</span>
              </label>
              <label class="macroControl">
                <span class="macroLabel">Swing</span>
                <input id="app1_b1_p1_swing" class="macroSlider" type="range" min="0" max="100" step="1" value="0" />
                <span id="app1_b1_p1_swing_value" class="macroValue">0%</span>
              </label>
              <label class="macroControl">
                <span class="macroLabel">Timing</span>
                <input id="app1_b1_p1_timing" class="macroSlider" type="range" min="0" max="50" step="1" value="0" />
                <span id="app1_b1_p1_timing_value" class="macroValue">±0 ms</span>
              </label>
              <input id="app1_b1_p1_projectName" class="app1TextInput app1ProjectNameInput" type="text" value="" placeholder="Project Name" aria-label="Project Name" maxlength="48" />
            </div>
          </div>
        </section>

        <section id="app1_b2_p1" class="app1-page hidden" aria-label="Mixer">
          <div class="app1-panel">
            <div id="app1_b2_p1_title" class="app1-title">mixer</div>
            <div class="app1-controls">
              <label class="macroControl mixerChannel mixerChannel-synth"><span id="app1_b2_p1_synth_label" class="macroLabel">Synth</span><input id="app1_b2_p1_synth" class="macroSlider mixerSlider" data-channel="synth" type="range" min="-60" max="6" step="0.5" value="0" /><span id="app1_b2_p1_synth_value" class="macroValue">0 dB</span></label>
              
              <label class="macroControl mixerChannel mixerChannel-kick"><span class="macroLabel">Kick</span><input id="app1_b2_p1_kick" class="macroSlider mixerSlider" data-channel="kick" type="range" min="-60" max="6" step="0.5" value="0" /><span id="app1_b2_p1_kick_value" class="macroValue">0 dB</span></label>
              <label class="macroControl mixerChannel mixerChannel-snare"><span class="macroLabel">Snare</span><input id="app1_b2_p1_snare" class="macroSlider mixerSlider" data-channel="snare" type="range" min="-60" max="6" step="0.5" value="0" /><span id="app1_b2_p1_snare_value" class="macroValue">0 dB</span></label>
              <label class="macroControl mixerChannel mixerChannel-hat"><span class="macroLabel">Hat</span><input id="app1_b2_p1_hat" class="macroSlider mixerSlider" data-channel="hat" type="range" min="-60" max="6" step="0.5" value="0" /><span id="app1_b2_p1_hat_value" class="macroValue">0 dB</span></label>
              <label class="macroControl mixerChannel mixerChannel-noise"><span class="macroLabel">Noise</span><input id="app1_b2_p1_noise" class="macroSlider mixerSlider" data-channel="noise" type="range" min="-60" max="6" step="0.5" value="0" /><span id="app1_b2_p1_noise_value" class="macroValue">0 dB</span></label>
              <label class="macroControl mixerChannel mixerChannel-drone"><span class="macroLabel">Drone</span><input id="app1_b2_p1_drone" class="macroSlider mixerSlider" data-channel="drone" type="range" min="-60" max="6" step="0.5" value="0" /><span id="app1_b2_p1_drone_value" class="macroValue">0 dB</span></label>
              <div class="interphace-toggle-group">
                <label class="app1ToggleControl app1PairedControl mixerArpTriggerToggle"><span class="macroLabel">Arp / Synth Playback</span><input id="app1_b2_p1_arpTrigger" type="checkbox" aria-label="Arp or synth playback" /><span class="toggleTrack" aria-hidden="true"></span></label>
                <label class="app1ToggleControl app1PairedControl mixerDroneNoiseLinkToggle"><span class="macroLabel">Drone / Noise Opposed Orbit</span><input id="app1_b2_p1_droneNoiseLink" type="checkbox" aria-label="Drone and noise opposed orbit" /><span class="toggleTrack" aria-hidden="true"></span></label>
              </div>
            </div>
          </div>
        </section>

        <section id="app1_b2_p2" class="app1-page app1-sequencer-page hidden" aria-label="Sequencer">
          <div id="app1_b2_p2_c1" class="grid interPhaceSequencerGrid" aria-label="Sequencer grid"></div>
        </section>

        <section id="app1_b3_p1" class="app1-page app1-utility-page hidden" aria-label="Import">
          <div class="app1-panel app1-utility-panel">
            <div id="app1_b3_p1_title" class="app1-title">import</div>
            <div id="app1_b3_p1_grid" class="backgroundSelectionGrid app1BackgroundSelectionGrid" aria-label="Import background selection grid"></div>
          </div>
        </section>

        <section id="app1_b4_p1" class="app1-page app1-utility-page hidden" aria-label="Export">
          <div class="app1-panel app1-utility-panel">
            <div id="app1_b4_p1_title" class="app1-title">export</div>
            <div id="app1_b4_p1_grid" class="backgroundSelectionGrid app1BackgroundSelectionGrid" aria-label="Export background selection grid"></div>
          </div>
        </section>

        <section id="app1_b5_p1" class="app1-page app1-settings-page hidden" aria-label="synthPhace Settings">
          <div class="app1-panel app1-settings-panel">
            <div id="app1_b5_p1_grid" class="backgroundSelectionGrid app1BackgroundSelectionGrid" aria-label="synthPhace settings background selection grid"></div>
            <div class="app1-settings-content">
              <div id="app1_b5_p1_title" class="app1-title app1-settings-title synth-title">synthPhace settings</div>
              <div class="app1-controls">
                <label class="macroControl"><span class="macroLabel">Timing</span><input id="app1_b5_p1_timing" class="macroSlider" type="range" min="0" max="100" step="1" value="100" /><span id="app1_b5_p1_timing_value" class="macroValue">100%</span></label>
                <label class="macroControl"><span class="macroLabel">Global Trigger Interval</span><input id="app1_b5_p1_loopLength" class="macroSlider" type="range" min="1" max="16" step="1" value="4" /><span id="app1_b5_p1_loopLength_value" class="macroValue">4 bars</span></label>
                <label class="macroControl"><span class="macroLabel">Effects Release</span><input id="app1_b5_p1_effectsRelease" class="macroSlider" type="range" min="0" max="57" step="1" value="11" /><span id="app1_b5_p1_effectsRelease_value" class="macroValue">120 ms</span></label>
                <label class="macroControl"><span class="macroLabel">Loop Voice Length</span><input id="app1_b5_p1_auditionLength" class="macroSlider" type="range" min="1" max="6" step="1" value="6" /><span id="app1_b5_p1_auditionLength_value" class="macroValue">Full</span></label>
                <div class="interphace-toggle-group">
                  <label class="app1ToggleControl app1PairedControl synthLoopToggle"><span class="macroLabel">Loop Audition</span><input id="app1_b5_p1_auditionLoop" type="checkbox" /><span class="toggleTrack" aria-hidden="true"></span></label>
                  <label class="app1ToggleControl app1PairedControl synthEngineToggle"><span class="macroLabel">FM / Pretty Engine</span><input id="app1_b5_p1_synthEngine" type="checkbox" aria-label="Pretty engine" /><span class="toggleTrack" aria-hidden="true"></span></label>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="app1_b5_p2" class="app1-page app1-settings-page hidden" aria-label="drumPhace Settings">
          <div class="app1-panel app1-settings-panel">
            <div id="app1_b5_p2_grid" class="backgroundSelectionGrid app1BackgroundSelectionGrid" aria-label="drumPhace settings background selection grid"></div>
            <div class="app1-settings-content">
              <div id="app1_b5_p2_title" class="app1-title app1-settings-title drum-title">drumPhace settings</div>
              <div class="app1-controls">
                <label class="macroControl"><span class="macroLabel">Timing</span><input id="app1_b5_p2_timing" class="macroSlider" type="range" min="0" max="100" step="1" value="100" /><span id="app1_b5_p2_timing_value" class="macroValue">100%</span></label>
                <label class="app1ToggleControl app1PairedControl drumBordersToggle"><span class="macroLabel">Borders</span><input id="app1_b5_p2_otherInstrumentBorders" type="checkbox" /><span class="toggleTrack" aria-hidden="true"></span></label>
              </div>
            </div>
          </div>
        </section>

        <section id="app1_b5_p3" class="app1-page app1-settings-page hidden" aria-label="arpPhace Settings">
          <div class="app1-panel app1-settings-panel">
            <div id="app1_b5_p3_grid" class="backgroundSelectionGrid app1BackgroundSelectionGrid" aria-label="arpPhace settings background selection grid"></div>
            <div class="app1-settings-content">
              <div id="app1_b5_p3_title" class="app1-title app1-settings-title arp-title">arpPhace settings</div>
              <div class="app1-controls">
                <label class="macroControl"><span class="macroLabel">Timing</span><input id="app1_b5_p3_timing" class="macroSlider" type="range" min="0" max="100" step="1" value="100" /><span id="app1_b5_p3_timing_value" class="macroValue">100%</span></label>
                <label class="macroControl"><span class="macroLabel">Effects Release</span><input id="app1_b5_p3_effectsRelease" class="macroSlider" type="range" min="0" max="57" step="1" value="2" /><span id="app1_b5_p3_effectsRelease_value" class="macroValue">30 ms</span></label>
                <label class="app1ToggleControl app1PairedControl arpToneToggle"><span class="macroLabel">Arp Tone</span><input id="app1_b5_p3_arpTone" type="checkbox" checked /><span class="toggleTrack" aria-hidden="true"></span></label>
              </div>
            </div>
          </div>
        </section>

        <section id="app1_b5_p4" class="app1-page app1-settings-page hidden" aria-label="noisePhace Settings">
          <div class="app1-panel app1-settings-panel">
            <div id="app1_b5_p4_grid" class="backgroundSelectionGrid app1BackgroundSelectionGrid" aria-label="noisePhace settings background selection grid"></div>
            <div class="app1-settings-content">
              <div id="app1_b5_p4_title" class="app1-title app1-settings-title noise-title">noisePhace settings</div>
              <div class="app1-controls">
                <label class="macroControl"><span class="macroLabel">Timing</span><input id="app1_b5_p4_timing" class="macroSlider" type="range" min="0" max="100" step="1" value="100" /><span id="app1_b5_p4_timing_value" class="macroValue">100%</span></label>
                <label class="macroControl"><span class="macroLabel">Start Offset</span><input id="app1_b5_p4_leadIn" class="macroSlider" type="range" min="-10" max="10" step="1" value="0" /><span id="app1_b5_p4_leadIn_value" class="macroValue">0 s</span></label>
                <label class="macroControl"><span class="macroLabel">Fade In</span><input id="app1_b5_p4_fadeIn" class="macroSlider" type="range" min="0" max="10" step="1" value="0" /><span id="app1_b5_p4_fadeIn_value" class="macroValue">0 s</span></label>
                <label class="macroControl"><span class="macroLabel">Export Length</span><input id="app1_b5_p4_exportLength" class="macroSlider" type="range" min="0" max="5" step="1" value="2" /><span id="app1_b5_p4_exportLength_value" class="macroValue">60 s</span></label>
              </div>
            </div>
          </div>
        </section>
        <section id="app1_b5_p5" class="app1-page app1-settings-page hidden" aria-label="dronePhace Settings">
          <div class="app1-panel app1-settings-panel">
            <div id="app1_b5_p5_grid" class="backgroundSelectionGrid app1BackgroundSelectionGrid" aria-label="dronePhace settings background selection grid"></div>
            <div class="app1-settings-content">
              <div id="app1_b5_p5_title" class="app1-title app1-settings-title drone-title">dronePhace settings</div>
              <div class="app1-controls">
                <label class="macroControl"><span class="macroLabel">Timing</span><input id="app1_b5_p5_timing" class="macroSlider" type="range" min="0" max="100" step="1" value="100" /><span id="app1_b5_p5_timing_value" class="macroValue">100%</span></label>
                <label class="macroControl"><span class="macroLabel">Start Offset</span><input id="app1_b5_p5_leadIn" class="macroSlider" type="range" min="-10" max="10" step="1" value="0" /><span id="app1_b5_p5_leadIn_value" class="macroValue">0 s</span></label>
                <label class="macroControl"><span class="macroLabel">Fade In</span><input id="app1_b5_p5_fadeIn" class="macroSlider" type="range" min="0" max="10" step="1" value="0" /><span id="app1_b5_p5_fadeIn_value" class="macroValue">0 s</span></label>
                <label class="macroControl"><span class="macroLabel">Export Length</span><input id="app1_b5_p5_exportLength" class="macroSlider" type="range" min="0" max="5" step="1" value="2" /><span id="app1_b5_p5_exportLength_value" class="macroValue">60 s</span></label>
              </div>
            </div>
          </div>
        </section>
      </section>

      <nav id="shellBottom" class="shell-bottom" aria-label="interPhace controls">
        <div class="shell-bottom-main">
          <button id="shellB1" class="shell-phace-btn active" type="button" aria-label="Project" title="Project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="11" cy="17" r="2"/></svg></button>
          <button id="shellB2" class="shell-phace-btn" type="button" aria-label="Mixer" title="Mixer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M12 4v16M18 4v16"/><rect x="4" y="7" width="4" height="4" rx="1"/><rect x="10" y="13" width="4" height="4" rx="1"/><rect x="16" y="9" width="4" height="4" rx="1"/></svg></button>
          <button id="shellB3" class="shell-phace-btn" type="button" aria-label="Import" title="Import"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M5 16v4h14v-4"/></svg></button>
          <button id="shellB4" class="shell-phace-btn" type="button" aria-label="Export" title="Export"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 16v4h14v-4"/></svg></button>
          <button id="shellB5" class="navBtn shell-phace-btn" type="button" aria-label="Child Phace Settings" title="Child Phace Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg><span id="app1_b5_page_num" class="num">1</span></button>
          <button id="shellB6" class="shell-phace-btn" type="button" aria-label="Phace" title="Phace">
            <svg class="phace-convergence-icon phace-six-p-icon" viewBox="0 0 24 24" aria-hidden="true">
  <circle class="phace-core" cx="12" cy="12" r="2.15"/>
  <g class="phace-p-inter" transform="rotate(0 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-synth" transform="rotate(60 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-arp" transform="rotate(120 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-drum" transform="rotate(180 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-noise" transform="rotate(240 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-drone" transform="rotate(300 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
</svg>
          </button>
        </div>
      </nav>
    </main>

    <script src="shared/bed-loop.js"></script>
<script src="shared/shell.js?v=499"></script>
  </body>
</html>
