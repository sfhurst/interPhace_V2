<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0f" />
    <title>interPhace - arpPhace</title>
    <link rel="stylesheet" href="style.css?v=207" />
    <script src="app.js?v=329" defer></script>
    <script src="audio/audition-engine.js?v=329" defer></script>
    <link rel="stylesheet" href="../shared/shell.css?v=486" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="../favicon.ico" type="image/x-icon">
</head>
  <body id="app3">
    <main id="shell" class="shell-app">
      <header id="shellTop" class="shell-top" aria-label="interPhace top bar"></header>

      <section id="shellMiddle" class="shell-middle">
        <section id="app3_b1_p1" class="logical-grid-page" aria-label="Melody pattern grid">
                <div id="app3_b1_p1_c1" data-name="melodyGrid" class="grid" aria-label="Melody pattern"></div>
              </section>
              
              <section id="app3_b2_p1" class="drum-synth-stage arp-editor-stage hidden" aria-label="Arp editor">
  <div id="app3_b2_pattern_grid" class="backgroundSelectionGrid arpPatternBackgroundGrid" aria-label="Arp pattern editor grid"></div>
                <div class="drum-synth-panel">
                  <div id="app3_b2_p1_title" data-name="arpEditorTitle" class="drum-synth-title">arp 1</div>
                  <div class="drum-synth-controls">
                    <label class="macroControl">
                      <span id="app3_b2_p1_c1_label" class="macroLabel">Rate</span>
                      <input id="app3_b2_p1_c1" data-name="rate" class="macroSlider" type="range" min="0" max="5" value="0"  step="1" />
                      <span id="app3_b2_p1_c1_value" class="macroValue">1/16</span>
                    </label>
                    <label class="macroControl">
                      <span id="app3_b2_p1_c2_label" class="macroLabel">Gate</span>
                      <input id="app3_b2_p1_c2" data-name="gate" class="macroSlider" type="range" min="10" max="100" step="1" value="1" />
                      <span id="app3_b2_p1_c2_value" class="macroValue">75%</span>
                    </label>
                    <label class="macroControl">
                      <span id="app3_b2_p1_c3_label" class="macroLabel">Pattern</span>
                      <input id="app3_b2_p1_c3" data-name="pattern" class="macroSlider" type="range" min="0" max="32" value="75" step="1" />
                      <span id="app3_b2_p1_c3_value" class="macroValue">Off</span>
                    </label>
                    <label class="macroControl">
                      <span id="app3_b2_p1_c4_label" class="macroLabel">Motion</span>
                      <input id="app3_b2_p1_c4" data-name="motion" class="macroSlider" type="range" min="0" max="0" value="0"  step="1" />
                      <span id="app3_b2_p1_c4_value" class="macroValue">50</span>
                    </label>
                  </div>
                </div>
              </section>
      </section>

      <nav id="shellBottom" class="shell-bottom" aria-label="arpPhace controls">
        <div class="shell-bottom-main">
          <button class="navBtn instrumentBtn active" id="shellB1" data-shell-role="pattern" type="button" aria-label="Melody 1" title="Melody 1">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l9-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="15.5" cy="16" r="2.5"/></svg><span class="num">1</span>
                  </button>
                  <button class="navBtn synthBtn" id="shellB2" type="button" aria-label="Arp 1" title="Arp 1">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h3v-3h3v-3h3V8h5"/><path d="M16 5l3 3-3 3"/></svg><span class="num">1</span>
                  </button>
                  <button class="navBtn chanceBtn" id="shellB3" type="button" aria-label="Phrase 1 chance" title="Phrase 1 chance">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M12 11.4c-1.5-1.1-3.7-2.1-5.2-1.2-1.6.9-1.6 3.3-.1 4.3 1.3.9 3.5.1 5.3-1.3"/>
  <path d="M12 11.4c1.5-1.1 3.7-2.1 5.2-1.2 1.6.9 1.6 3.3.1 4.3-1.3.9-3.5.1-5.3-1.3"/>
  <path d="M11.9 11.5c-1.1-1.5-2.1-3.7-1.2-5.2.9-1.6 3.3-1.6 4.3-.1.9 1.3.1 3.5-1.3 5.3"/>
  <path d="M12.1 11.5c-1.1 1.5-2.1 3.7-1.2 5.2.9 1.6 3.3 1.6 4.3.1.9-1.3.1-3.5-1.3-5.3"/>
  <path d="M12 13.2c-.2 3.2-1.1 5.4-2.8 7"/>
</svg><span class="num">1</span>
                  </button>
                  <button class="navBtn styleBtn" id="shellB4" data-shell-role="style" type="button" aria-label="Phrase style">rand</button>
                  <button class="navBtn generateBtn" id="shellB5" data-shell-role="generate" type="button" aria-label="Generate phrase" title="Generate phrase">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3.4c1.4 0 2.2.7 3 1.8l3.2 4.5c.8 1.1 1.6 1.7 3 1.7H20"/><path d="M17 12l3 3-3 3"/><path d="M4 17h3.4c1.4 0 2.2-.7 3-1.8l3.2-4.5c.8-1.1 1.6-1.7 3-1.7H20"/><path d="M17 4l3 3-3 3"/></svg>
                  </button>
<button class="navBtn shell-phace-btn" id="shellB6" type="button" aria-label="Phace" title="Phace">
            <svg class="phace-convergence-icon phace-six-p-icon" viewBox="0 0 24 24" aria-hidden="true">
  <circle class="phace-core" cx="12" cy="12" r="2.15"/>
  <g class="phace-p-inter" transform="rotate(0 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-synth" transform="rotate(60 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-arp" transform="rotate(120 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-drum" transform="rotate(180 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-noise" transform="rotate(240 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
<g class="phace-p-drone" transform="rotate(300 12 12)">
  <path d="M12 9.3V4.1M12 4.1h1.55c1.35 0 2.25.75 2.25 1.9s-.9 1.9-2.25 1.9H12"/>
</g>
</svg>
          </button>
        </div>
      </nav>
    </main>
<div class="tempoControl">
            <span id="tempoValue" class="tempoValue">75 BPM</span>
</div>
        </div>

        <div class="settingsSection">
          <div class="settingLabel">Export</div>
          <div class="futureGrid three exportGrid">
</div>
          <div id="exportStatus" class="settingHint" aria-live="polite">Exports Kick · Snare · CHH · Full kit for the visible bars.</div>
        </div>

        <div class="settingsSection">
          <div class="settingLabel">MIDI import</div>
          <label class="fileAction" for="midiImportInput">Import MIDI</label>
<div id="midiImportStatus" class="settingHint" aria-live="polite">Recognized Kick 36 · Snare 38 · CHH 42 are quantized to the grid.</div>
        </div>

        <div class="settingsSection">
          <div class="settingLabel">Temporary samples</div>
          <div class="futureGrid three sampleGrid">
            <label class="fileAction" for="kickSampleInput"><span>Kick</span><small id="kickSampleName">Synth</small></label>
            <label class="fileAction" for="snareSampleInput"><span>Snare</span><small id="snareSampleName">Synth</small></label>
            <label class="fileAction" for="hatSampleInput"><span>CHH</span><small id="hatSampleName">Synth</small></label>
          </div>
<div id="sampleStatus" class="settingHint" aria-live="polite">Maximum 2 MB and 2.0 seconds. Samples reset when the page reloads.</div>
</div>

        <div class="settingsSection dangerSection">
<div class="settingHint">Clears all 8 stored bars for the active instrument.</div>
        </div>
      </section>
    </div>

    


    

  


  <script src="../shared/shell.js?v=200"></script>
<script>
</script>






</body>
</html>
